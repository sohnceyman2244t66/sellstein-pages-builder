name: Build and Deploy
# Triggered via repository_dispatch from operator-api with event_type
# build-deploy. Payload (client_payload) carries:
#
#   {
#     "deploy_id":      "...",
#     "framework":      "nextjs|nuxt|astro|vite-react|...",
#     "source_url":     "https://api.sellstein.com/internal/build-source/...",
#     "callback_url":   "https://api.sellstein.com/pages-build-callback/...",
#     "callback_token": "<base64url(hmac)>.<exp>",
#     "build_command":  "npm run build",
#     "install_command":"npm install",
#     "output_dir":     "dist",
#     "node_version":   "20",
#     "runtime":        "node|hugo|jekyll|python"
#   }

on:
  repository_dispatch:
    types: [build-deploy]

concurrency:
  group: build-${{ github.event.client_payload.deploy_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.client_payload.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve inputs
        id: vars
        env:
          DEPLOY_ID: ${{ github.event.client_payload.deploy_id }}
          FRAMEWORK: ${{ github.event.client_payload.framework }}
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_TOKEN: ${{ github.event.client_payload.callback_token }}
          BUILD_CMD_IN: ${{ github.event.client_payload.build_command }}
          INSTALL_CMD_IN: ${{ github.event.client_payload.install_command }}
          OUTPUT_DIR_IN: ${{ github.event.client_payload.output_dir }}
          NODE_VERSION_IN: ${{ github.event.client_payload.node_version }}
          RUNTIME_IN: ${{ github.event.client_payload.runtime }}
        run: |
          set -e
          for var in DEPLOY_ID FRAMEWORK SOURCE_URL CALLBACK_URL CALLBACK_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required client_payload field: $var"
              exit 1
            fi
          done
          case "$CALLBACK_URL" in
            https://api.sellstein.com/*) ;;
            https://*.sellstein.com/*)   ;;
            https://operator-api.*.workers.dev/*) ;;
            *)
              echo "::error::Refusing callback to $CALLBACK_URL"
              exit 1
              ;;
          esac
          BUILD_CMD="${BUILD_CMD_IN:-npm run build}"
          INSTALL_CMD="${INSTALL_CMD_IN:-npm install --no-audit --no-fund}"
          OUTPUT_DIR="${OUTPUT_DIR_IN:-dist}"
          NODE_VERSION="${NODE_VERSION_IN:-20}"
          RUNTIME="${RUNTIME_IN:-node}"
          {
            echo "deploy_id=$DEPLOY_ID"
            echo "framework=$FRAMEWORK"
            echo "source_url=$SOURCE_URL"
            echo "callback_url=$CALLBACK_URL"
            echo "build_cmd=$BUILD_CMD"
            echo "install_cmd=$INSTALL_CMD"
            echo "output_dir=$OUTPUT_DIR"
            echo "node_version=$NODE_VERSION"
            echo "runtime=$RUNTIME"
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$CALLBACK_TOKEN"
          echo "callback_token=$CALLBACK_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.vars.outputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.vars.outputs.node_version }}

      - name: Set up Hugo
        if: steps.vars.outputs.runtime == 'hugo'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.131.0'
          extended: true

      - name: Set up Ruby (Jekyll)
        if: steps.vars.outputs.runtime == 'jekyll'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Set up Python (MkDocs / Pelican)
        if: steps.vars.outputs.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download source tarball
        id: source
        env:
          SOURCE_URL: ${{ steps.vars.outputs.source_url }}
        run: |
          set -e
          mkdir -p src
          curl --fail --silent --show-error --location \
            --connect-timeout 30 --max-time 180 --max-filesize 209715200 \
            -H "User-Agent: sellstein-pages-builder" \
            -o src.tar.gz "$SOURCE_URL"
          if tar -tzf src.tar.gz | grep -E '^(/|.*\.\.\/)' >/dev/null; then
            echo "::error::Source archive contains unsafe paths"
            exit 1
          fi
          tar -xzf src.tar.gz -C src
          rm src.tar.gz
          ROOT="src"
          has_sig() {
            local d="$1"
            for f in package.json next.config.js next.config.mjs next.config.ts next.config.cjs \
                     vite.config.js vite.config.ts vite.config.mjs astro.config.mjs astro.config.ts \
                     nuxt.config.ts nuxt.config.js svelte.config.js svelte.config.ts gatsby-config.js \
                     remix.config.js remix.config.ts angular.json index.html index.htm \
                     hugo.toml hugo.yaml config.toml _config.yml Gemfile mkdocs.yml pelicanconf.py \
                     requirements.txt pyproject.toml composer.json; do
              if [ -e "$d/$f" ]; then return 0; fi
            done
            return 1
          }
          if ! has_sig "$ROOT"; then
            entries=$(ls -A "$ROOT" 2>/dev/null | grep -v '^\.' || true)
            count=$(echo "$entries" | grep -c '.' || true)
            if [ "$count" -eq 1 ]; then
              only="$(echo "$entries" | head -n1)"
              if [ -d "$ROOT/$only" ] && has_sig "$ROOT/$only"; then
                echo "Detected wrapper directory '$only' — shifting working dir."
                ROOT="$ROOT/$only"
              fi
            fi
          fi
          if ! has_sig "$ROOT"; then
            echo "::warning::Could not find project signatures at $ROOT — build may fail. Top-level listing:"
            ls -la "$ROOT" | head -30
          fi
          echo "src_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Extracted source to $ROOT ($(du -sh "$ROOT" | awk '{print $1}'))"

      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.src_root }}
        env:
          INSTALL_CMD: ${{ steps.vars.outputs.install_cmd }}
          FRAMEWORK: ${{ steps.vars.outputs.framework }}
          RUNTIME: ${{ steps.vars.outputs.runtime }}
        run: |
          set -e
          case "$RUNTIME" in
            node)
              echo "::group::install (node)"
              if [ -f package-lock.json ]; then
                npm ci --no-audit --no-fund
              elif [ -f pnpm-lock.yaml ]; then
                corepack enable
                # Pin pnpm to v9 (latest line that supports Node 20).
                # Without this, corepack auto-downloads pnpm 11+ which
                # requires Node v22.13+ for node:sqlite -- boom on Node 20.
                corepack prepare pnpm@9.15.9 --activate
                pnpm install --no-frozen-lockfile
              elif [ -f yarn.lock ]; then
                corepack enable
                # Pin yarn to classic v1 (what 95%+ of user projects with
                # yarn.lock actually use). Avoids Berry's strict-mode bites.
                corepack prepare yarn@1.22.22 --activate
                yarn install --no-immutable
              else
                eval "$INSTALL_CMD"
              fi
              echo "::endgroup::"
              ;;
            jekyll)
              echo "::group::bundle install"
              if [ ! -f Gemfile ]; then
                printf 'source "https://rubygems.org"\ngem "jekyll", "~> 4.3"\n' > Gemfile
              fi
              bundle config set --local path 'vendor/bundle'
              bundle install --jobs 4 --retry 3
              echo "::endgroup::"
              ;;
            python)
              echo "::group::pip install"
              python -m pip install --upgrade pip
              if [ -f requirements.txt ]; then
                pip install -r requirements.txt
              elif [ -f pyproject.toml ]; then
                pip install . || true
              fi
              case "$FRAMEWORK" in
                mkdocs) pip show mkdocs >/dev/null 2>&1 || pip install mkdocs mkdocs-material ;;
                pelican) pip show pelican >/dev/null 2>&1 || pip install "pelican[markdown]" ;;
              esac
              echo "::endgroup::"
              ;;
            hugo)
              echo "Hugo binary already on PATH"
              ;;
            *)
              echo "::error::Unsupported runtime: $RUNTIME"
              exit 1
              ;;
          esac

      - name: Build
        working-directory: ${{ steps.source.outputs.src_root }}
        env:
          BUILD_CMD: ${{ steps.vars.outputs.build_cmd }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'
          ASTRO_TELEMETRY_DISABLED: '1'
          GATSBY_TELEMETRY_DISABLED: '1'
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          set -e
          echo "::group::build ($BUILD_CMD)"
          eval "$BUILD_CMD"
          echo "::endgroup::"

      - name: Verify output dir
        id: verify
        working-directory: ${{ steps.source.outputs.src_root }}
        env:
          OUTPUT_DIR: ${{ steps.vars.outputs.output_dir }}
        run: |
          set -e
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::Build produced no output at $OUTPUT_DIR"
            ls -la
            exit 1
          fi
          FILE_COUNT=$(find "$OUTPUT_DIR" -type f | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Output dir is empty"
            exit 1
          fi
          SIZE_BYTES=$(du -sb "$OUTPUT_DIR" | awk '{print $1}')
          if [ "$SIZE_BYTES" -gt 209715200 ]; then
            echo "::error::Build output too large: $((SIZE_BYTES / 1024 / 1024)) MB"
            exit 1
          fi
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Tar build output
        working-directory: ${{ steps.source.outputs.src_root }}
        env:
          OUTPUT_DIR: ${{ steps.vars.outputs.output_dir }}
        run: |
          set -e
          tar -czf /tmp/build-output.tar.gz -C "$OUTPUT_DIR" .
          ls -lh /tmp/build-output.tar.gz

      - name: Upload to operator-api
        env:
          CALLBACK_URL: ${{ steps.vars.outputs.callback_url }}
          CALLBACK_TOKEN: ${{ steps.vars.outputs.callback_token }}
          FILE_COUNT: ${{ steps.verify.outputs.file_count }}
          SIZE_BYTES: ${{ steps.verify.outputs.size_bytes }}
        run: |
          set -e
          status_code=$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}' \
            --connect-timeout 30 --max-time 600 \
            -X POST \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/gzip" \
            -H "X-Build-Status: success" \
            -H "X-Build-File-Count: $FILE_COUNT" \
            -H "X-Build-Bytes: $SIZE_BYTES" \
            --data-binary "@/tmp/build-output.tar.gz" \
            "$CALLBACK_URL" || true)
          echo "Callback HTTP $status_code"
          cat /tmp/response.json 2>/dev/null || true
          if [ "$status_code" != "200" ] && [ "$status_code" != "202" ]; then
            echo "::error::Callback returned status $status_code"
            exit 1
          fi

      - name: Report failure
        if: failure()
        env:
          CALLBACK_URL: ${{ steps.vars.outputs.callback_url }}
          CALLBACK_TOKEN: ${{ steps.vars.outputs.callback_token }}
          DEPLOY_ID: ${{ steps.vars.outputs.deploy_id }}
        run: |
          curl --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Build-Status: failed" \
            -d "{\"deploy_id\":\"$DEPLOY_ID\",\"error\":\"build-failed\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$CALLBACK_URL?status=failed" || true
